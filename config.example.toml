[plugin]
enabled = true
config_version = "0.3.0"

[schedule]
# 到点扫描间隔（秒）
scan_interval_seconds = 20
# 每个聊天流最多同时挂起的提醒数（防刷）
max_pending_per_stream = 20
# 默认提前提醒量（分钟）。通用默认关闭；
# 排小粥建议：训练/比赛类活动提前 120 分钟（改成 [120]）按需开启
default_advance_minutes = []

[parse]
# 时间解析用的模型任务名（空 = 宿主默认 utils 任务）
model_task = ""

[delivery]
# 到点提醒首选 proactive.trigger（由 bot 本体口吻生成，人设一致）
use_proactive = true
# proactive 入队后这么多秒仍未确认 bot 发过言，则兜底直发（0 = 不验证）
fallback_after_seconds = 120

[observe]
# 自动观察群里"已敲定"的未来约定（训练/比赛/聚餐），到点主动提醒一次
auto_observe = true
# 每个聊天流每小时最多主动播报条数（超出改兜底直发，保证必达但不刷屏）
max_per_hour = 2
# 比赛：开始前一天的这个时刻提醒（HH:MM）
match_prior_day_time = "20:00"
# 比赛兜底提前量（分钟）：若"前一天"时点已过，则提前这么多分钟提醒
match_advance_minutes = 180
# 训练提醒提前量（分钟）
training_advance_minutes = 60
# 聚餐/吃饭提醒提前量（分钟）
meal_advance_minutes = 30
# 其他活动默认提前量（分钟）
general_advance_minutes = 30
